@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700;800&display=swap');
:root{--bg:#f7f6f1;--paper:#fff;--ink:#183b32;--muted:#83908a;--line:#e8ebe5;--accent:#235747;--gold:#d99b53;--red:#bd5b4e;--soft:#e9f0eb;--shadow:0 12px 35px #163b3010}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans','IBM Plex Sans Thai',sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.shell{max-width:520px;margin:auto;min-height:100dvh;padding:24px 18px 116px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.brand{font-size:26px;letter-spacing:-1.3px;font-weight:800}.tagline{font-size:12px;color:var(--muted)}.avatar{width:42px;height:42px;border-radius:15px;background:#e4ebe4;display:grid;place-items:center;font-size:21px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.6px;color:#83968a;text-transform:uppercase}.heading{font-size:26px;letter-spacing:-.8px;margin:7px 0 18px}.hero{background:var(--accent);border-radius:26px;color:#fff;padding:24px;position:relative;overflow:hidden;box-shadow:var(--shadow)}.hero:after{content:'✳';font-size:160px;position:absolute;right:-30px;top:-70px;opacity:.08}.hero small{color:#d1dfd7}.big{font-size:39px;letter-spacing:-1.7px;font-weight:800;margin:8px 0 20px}.hero-stats{display:flex;gap:14px}.hero-stats>div{flex:1;background:#ffffff13;border-radius:14px;padding:12px}.hero-stats b{display:block;font-size:18px;margin-top:4px}.section{display:flex;align-items:center;justify-content:space-between;margin:27px 0 13px}.section h2{font-size:17px;margin:0}.link{border:0;background:none;color:var(--accent);font-weight:700;font-size:13px}.card{background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:16px;box-shadow:0 2px 9px #163b3006;margin-bottom:10px}.bill{display:flex;align-items:center;gap:13px;width:100%;text-align:left;color:inherit}.bill-icon{width:46px;height:46px;border-radius:15px;background:#f1f1e9;display:grid;place-items:center;font-size:23px;flex-shrink:0}.bill-main{flex:1;min-width:0}.bill-main b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bill-main small,.muted{color:var(--muted);font-size:12px}.amount{font-weight:800;font-size:16px}.positive{color:#27775d}.negative{color:var(--red)}.empty{padding:35px 18px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #d9e1d9;border-radius:20px}.nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:9px 12px max(12px,env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:30}.nav-inner{width:min(520px,100%);display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:center}.nav button{border:0;background:none;color:#8d9c93;font-size:11px;font-weight:700;display:grid;justify-items:center;gap:3px}.nav button.active{color:var(--accent)}.nav .ico{font-size:23px}.nav .plus{width:56px;height:56px;border-radius:20px;background:var(--accent);color:white;font-size:32px;line-height:1;box-shadow:0 6px 18px #1b4c3c35;transform:translateY(-10px)}.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;background:var(--accent);color:#fff}.btn.secondary{background:var(--soft);color:var(--accent)}.btn.ghost{background:#f5f5f1;color:var(--ink)}.btn.danger{background:#fcecea;color:var(--red)}.full{width:100%}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.stack{display:grid;gap:12px}.field{display:grid;gap:7px}.field label{font-size:12px;color:#647a6e;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid #e1e7df;background:#fbfcfa;border-radius:13px;padding:13px;color:var(--ink);outline:0;min-width:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:#7a9f88}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #dce6dd;background:#fff;border-radius:30px;padding:8px 12px;font-size:12px;color:var(--ink)}.chip.selected{background:var(--accent);color:white;border-color:var(--accent)}.sheet-back{position:fixed;inset:0;background:#142d2688;z-index:40;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(520px,100%);max-height:94dvh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:20px 19px max(25px,env(safe-area-inset-bottom));box-shadow:0 -12px 40px #0002}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:19px}.sheet-head h2{margin:0;font-size:21px}.x{border:0;background:#e9ede7;border-radius:50%;width:32px;height:32px;color:var(--ink)}.person{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:#fff;padding:11px 12px;border-radius:12px}.person input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}.split-grid{display:grid;grid-template-columns:1fr 110px;align-items:center;gap:8px}.split-grid input{width:100%;padding:9px;border-radius:10px;border:1px solid var(--line)}.subtle{font-size:12px;color:var(--muted)}.tabs{display:flex;background:#e9eee8;padding:4px;border-radius:13px;gap:3px}.tabs button{flex:1;border:0;border-radius:10px;background:transparent;padding:10px 6px;font-size:12px;font-weight:700;color:#637a6c}.tabs button.active{background:white;color:var(--ink);box-shadow:0 2px 5px #0001}.divider{border-top:1px solid var(--line);margin:13px 0}.receipt{max-width:100%;max-height:150px;object-fit:contain;border-radius:12px}.pill{font-size:11px;padding:5px 9px;border-radius:30px;background:#e9f2e9;color:#347353}.alert{background:#fff4e4;border:1px solid #f0dcbb;padding:12px;border-radius:12px;color:#91642e;font-size:12px}.settle{background:#edf4ef;border-radius:15px;padding:13px;margin:9px 0}.smallbtn{border:0;border-radius:9px;padding:7px 10px;background:#e6ede7;color:var(--accent);font-weight:700;font-size:12px}.listline{padding:12px 0;border-bottom:1px solid var(--line)}.listline:last-child{border:0}.stat{font-size:13px}.stat strong{font-size:21px;display:block}.hidden{display:none!important}body.dark{--bg:#121a17;--paper:#1d2923;--ink:#f2f6f1;--muted:#a0aea5;--line:#334138;--soft:#2a4135;--accent:#356d57}body.dark .field input,body.dark .field select,body.dark .field textarea,body.dark .chip,body.dark .person,body.dark .tabs button.active{background:#25342b;color:#fff}body.dark .nav{background:#1b2721ee}body.dark .empty{background:#1d2923}body.dark .hero{background:#254d3d}body.dark .tabs{background:#29372e}@media(min-width:720px){.shell{padding-top:36px}.nav{left:50%;right:auto;width:520px;transform:translateX(-50%);border-radius:22px 22px 0 0}}
@media(max-width:390px){.brand{font-size:23px}.brand img{width:30px!important;height:30px!important}}

.inbox-toolbar{display:flex;gap:8px;margin:12px 0 18px}.inbox-toolbar .btn{flex:1}.inbox-card{display:grid;grid-template-columns:66px 1fr;gap:12px;align-items:start}.inbox-thumb{width:66px;height:72px;object-fit:cover;border-radius:12px;background:var(--soft)}.inbox-thumb.blank{display:grid;place-items:center;font-size:26px}.inbox-meta{min-width:0}.inbox-meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.inbox-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.inbox-actions button{font-size:11px}.preview-large{width:100%;max-height:50vh;object-fit:contain;border-radius:15px;background:var(--soft)}.form-two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.inbox-banner{background:#fff3df;border-radius:18px;padding:14px;margin:12px 0;color:#7c592b}.inbox-count{font-weight:800;color:var(--accent)}body.dark .inbox-banner{background:#3b3224;color:#efc88d}
</style></head><body><main class="shell"><header class="top"><div><div class="brand"><img src="icon.svg" alt="" style="width:35px;height:35px;border-radius:10px;vertical-align:middle;margin-right:7px">#ourbills<span style="color:var(--gold)">.</span></div><div class="tagline">ความสนุกมีค่าใช้จ่าย</div></div><button class="avatar" onclick="openSettings()" aria-label="ตั้งค่า">⚙️</button></header><div id="view"></div></main><nav class="nav"><div class="nav-inner"><button id="nav-home" onclick="go('home')"><span class="ico">⌂</span>Home</button><button id="nav-bills" onclick="go('bills')"><span class="ico">▤</span>Bills</button><button class="plus" onclick="openExpense()" aria-label="เพิ่มรายการ">+</button><button id="nav-inbox" onclick="go('inbox')"><span class="ico">▧</span>Inbox</button><button id="nav-people" onclick="go('people')"><span class="ico">♧</span>People</button></div></nav><div id="modal"></div><script>
const KEY='ourbills_v2_data';const $=s=>document.querySelector(s);const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'฿'+(Math.round((Number(n)||0)*100)/100).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});const today=()=>new Date().toISOString().slice(0,10);const datefmt=s=>new Date(s+'T12:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});let state={version:2,people:[{id:'me',name:'เรา'}],bills:[],activeBill:null,theme:'light'};try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.people)&&Array.isArray(s.bills))state={...state,...s}}catch{}let page='home',billId=null,editing=null,receiptData=null,splitMode='equal',selected=[],custom={},percentage={},draftPayer='me';const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('พื้นที่จัดเก็บเต็ม กรุณาสำรองข้อมูลและลดขนาดรูปสลิป');return false}};const person=id=>state.people.find(p=>p.id===id)?.name||'ไม่ทราบชื่อ';const bill=id=>state.bills.find(b=>b.id===id);const current=()=>bill(billId||state.activeBill);const total=b=>(b.items||[]).reduce((s,i)=>s+i.amount,0);const cents=n=>Math.round(Number(n||0)*100);function balances(b){let map=Object.fromEntries(state.people.map(p=>[p.id,0]));for(const i of b.items||[]){map[i.payer]=(map[i.payer]||0)+cents(i.amount);for(const [p,a] of Object.entries(i.shares||{}))map[p]=(map[p]||0)-cents(a)}for(const s of b.settlements||[]){map[s.from]=(map[s.from]||0)+cents(s.amount);map[s.to]=(map[s.to]||0)-cents(s.amount)}return map}function transfers(b){const m=balances(b);let pos=Object.entries(m).filter(([,v])=>v>0).map(([id,v])=>({id,v}));let neg=Object.entries(m).filter(([,v])=>v<0).map(([id,v])=>({id,v:-v}));let out=[];let i=0,j=0;while(i<neg.length&&j<pos.length){const v=Math.min(neg[i].v,pos[j].v);if(v>0)out.push({from:neg[i].id,to:pos[j].id,amount:v/100});neg[i].v-=v;pos[j].v-=v;if(!neg[i].v)i++;if(!pos[j].v)j++}return out}function balanceMine(){let v=0;for(const b of state.bills)v+=(balances(b).me||0)/100;return v}function go(p,id){page=p;if(id){billId=id;state.activeBill=id;persist()}render();scrollTo(0,0)}function render(){document.body.classList.toggle('dark',state.theme==='dark');for(const p of ['home','bills','people'])$('#nav-'+p).classList.toggle('active',page===p||page==='detail'&&p==='bills');$('#view').innerHTML=page==='home'?home():page==='bills'?billsView():page==='people'?peopleView():detailView()}function home(){const bal=balanceMine(),receive=state.bills.reduce((s,b)=>s+Math.max(0,(balances(b).me||0)/100),0),owe=state.bills.reduce((s,b)=>s+Math.max(0,-(balances(b).me||0)/100),0);return `<div class="eyebrow">YOUR SHARED EXPENSES</div><h1 class="heading">วันนี้เคลียร์กันหรือยัง?</h1><section class="hero"><small>ยอดสุทธิของคุณ · ทุกบิล</small><div class="big">${bal>=0?'+':'−'}${money(Math.abs(bal))}</div><div class="hero-stats"><div><small>↙ รอรับเงิน</small><b>${money(receive)}</b></div><div><small>↗ ต้องจ่าย</small><b>${money(owe)}</b></div></div></section><div class="section"><h2>บิลล่าสุด</h2><button class="link" onclick="go('bills')">ดูทั้งหมด →</button></div>${state.bills.length?state.bills.slice().sort((a,b)=>b.created.localeCompare(a.created)).slice(0,5).map(b=>billCard(b)).join(''):`<div class="empty">🍵<p>ยังไม่มีบิล เริ่มจากมื้อแรกของคุณได้เลย</p><button class="btn" onclick="openBill()">สร้างบิลแรก</button></div>`}<div class="section"><h2>บันทึกให้ทัน ไม่ต้องจำทีหลัง</h2></div><div class="card"><div class="row between"><div><b>Quick Capture</b><div class="subtle">จดชื่อและยอดก่อน ค่อยหารภายหลัง</div></div><button class="btn secondary" onclick="openExpense()">+ บันทึก</button></div></div>`}function billCard(b){const v=(balances(b).me||0)/100;return `<button class="card bill" onclick="go('detail','${b.id}')"><span class="bill-icon">${esc(b.emoji||'🍽️')}</span><span class="bill-main"><b>${esc(b.name)}</b><small>${datefmt(b.date)} · ${b.items.length} รายการ · ${b.participants.length} คน</small></span><span style="text-align:right"><span class="amount ${v>0?'positive':v<0?'negative':''}">${v>0?'+':v<0?'−':''}${money(Math.abs(v))}</span><br><small class="muted">${b.items.some(i=>!Object.keys(i.shares||{}).length)?'รอหาร':transfers(b).length?'รอเคลียร์':'เคลียร์แล้ว'}</small></span></button>`}function billsView(){return `<div class="row between"><div><div class="eyebrow">ALL YOUR MOMENTS</div><h1 class="heading">บิลทั้งหมด</h1></div><button class="btn secondary" onclick="openBill()">+ สร้างบิล</button></div>${state.bills.length?state.bills.slice().sort((a,b)=>b.created.localeCompare(a.created)).map(billCard).join(''):`<div class="empty">ยังไม่มีบิลที่บันทึกไว้</div>`}`}function peopleView(){return `<div class="row between"><div><div class="eyebrow">YOUR CIRCLE</div><h1 class="heading">คนของเรา</h1></div><button class="btn secondary" onclick="openPerson()">+ เพิ่มคน</button></div><p class="subtle">เพิ่มครั้งเดียว ใช้ซ้ำได้ทุกบิล</p>${state.people.map(p=>`<div class="card row between"><div class="row"><span class="bill-icon">${p.id==='me'?'🙋':'🙂'}</span><b>${esc(p.name)}</b></div>${p.id!=='me'?`<button class="smallbtn" onclick="openPerson('${p.id}')">แก้ไข</button>`:'<span class="pill">บัญชีของฉัน</span>'}</div>`).join('')}`}function detailView(){const b=current();if(!b)return billsView();const tr=transfers(b);const unassigned=b.items.filter(i=>!Object.keys(i.shares||{}).length);return `<button class="link" onclick="go('bills')">← บิลทั้งหมด</button><div class="row between" style="margin-top:12px"><div><div class="eyebrow">${datefmt(b.date)}</div><h1 class="heading">${esc(b.emoji||'🍽️')} ${esc(b.name)}</h1></div><button class="smallbtn" onclick="openBill('${b.id}')">แก้ไข</button></div><section class="hero"><small>ยอดค่าใช้จ่ายทั้งบิล</small><div class="big">${money(total(b))}</div><div class="hero-stats"><div><small>รายการ</small><b>${b.items.length}</b></div><div><small>สมาชิก</small><b>${b.participants.length}</b></div></div></section><div class="section"><h2>รายการที่จ่าย</h2><button class="link" onclick="openExpense(null,'${b.id}')">+ เพิ่มรายการ</button></div>${b.items.length?b.items.map(i=>`<div class="card"><div class="row between"><div style="min-width:0"><b>${esc(i.name)}</b><div class="subtle">${esc(person(i.payer))} จ่าย · ${datefmt(i.date)} · ${Object.keys(i.shares||{}).length?Object.keys(i.shares).length+' คน':'ยังไม่หาร'}</div></div><div style="text-align:right"><b>${money(i.amount)}</b><br><button class="link" onclick="openExpense('${i.id}','${b.id}')">แก้ไข</button></div></div>${i.note?`<div class="subtle">${esc(i.note)}</div>`:''}${i.receipt?`<div style="margin-top:8px"><img class="receipt" src="${i.receipt}" alt="สลิปของรายการ"></div>`:''}</div>`).join(''):`<div class="empty">ยังไม่มีรายการจ่าย</div>`}${unassigned.length?`<div class="alert">มี ${unassigned.length} รายการที่ยังไม่ได้แบ่งยอด สามารถกลับมาแก้ไขภายหลังได้</div>`:''}<div class="section"><h2>สรุปยอดโอน</h2><button class="link" onclick="shareBill()">แชร์ ↗</button></div>${tr.length?tr.map(t=>`<div class="settle"><div class="row between"><div><b>${esc(person(t.from))} → ${esc(person(t.to))}</b><div class="subtle">ยอดคงเหลือ</div></div><div style="text-align:right"><b>${money(t.amount)}</b><br><button class="smallbtn" onclick="openSettle('${t.from}','${t.to}',${t.amount})">บันทึกโอน</button></div></div></div>`).join(''):`<div class="card muted">${unassigned.length?'ยังมีรายการที่รอหาร':'ยอดทุกคนเคลียร์แล้ว ✓'}</div>`}<div class="section"><h2>ประวัติการคืนเงิน</h2></div>${(b.settlements||[]).length?b.settlements.map(s=>`<div class="card row between"><div><b>${esc(person(s.from))} → ${esc(person(s.to))}</b><div class="subtle">${datefmt(s.date)}</div></div><div><b>${money(s.amount)}</b> <button class="smallbtn" onclick="deleteSettlement('${s.id}')">ลบ</button></div></div>`).join(''):'<div class="subtle">ยังไม่มีรายการคืนเงิน</div>'}<div class="section"><button class="link" onclick="exportOneBill()">ส่งออกบิล JSON</button><button class="link" style="color:var(--red)" onclick="deleteBill()">ลบบิล</button></div>`}function modal(html){$('#modal').innerHTML=`<div class="sheet-back" onclick="if(event.target===this)closeModal()"><section class="sheet">${html}</section></div>`}function closeModal(){$('#modal').innerHTML=''}function header(t){return `<div class="sheet-head"><h2>${t}</h2><button class="x" onclick="closeModal()">✕</button></div>`}function openBill(id){const b=id?bill(id):null;modal(`${header(b?'แก้ไขบิล':'สร้างบิลใหม่')}<form class="stack" onsubmit="saveBill(event,'${id||''}')"><div class="field"><label>ชื่อบิล / ชื่อทริป</label><input name="name" required maxlength="100" placeholder="เช่น Dinner with แฟน" value="${esc(b?.name||'')}"></div><div class="field"><label>วันที่</label><input name="date" type="date" required value="${b?.date||today()}"></div><div class="field"><label>ไอคอน</label><select name="emoji">${['🍽️','☕','🍻','🚗','🏝️','🎬','🛍️','🏠'].map(x=>`<option ${b?.emoji===x?'selected':''}>${x}</option>`).join('')}</select></div><label class="subtle">สมาชิกในบิล (เพิ่มคนได้ที่หน้า People)</label>${state.people.map(p=>`<label class="person"><span>${esc(p.name)}</span><input type="checkbox" name="members" value="${p.id}" ${!b||b.participants.includes(p.id)?'checked':''}></label>`).join('')}<button class="btn full">${b?'บันทึกการแก้ไข':'สร้างบิล'}</button></form>`)}function saveBill(e,id){e.preventDefault();const f=new FormData(e.target),members=f.getAll('members');if(!members.length)return alert('เลือกสมาชิกอย่างน้อยหนึ่งคน');if(id){const b=bill(id);Object.assign(b,{name:f.get('name').trim(),date:f.get('date'),emoji:f.get('emoji'),participants:members})}else{const b={id:uid(),name:f.get('name').trim(),date:f.get('date'),emoji:f.get('emoji'),participants:members,items:[],settlements:[],created:new Date().toISOString()};state.bills.push(b);billId=b.id;state.a function openExpense(id,bid){editing=id||null;const b=bid?bill(bid):current(),i=id?b?.items.find(x=>x.id===id):null;receiptData=i?.receipt||null;splitMode=i?(!Object.keys(i.shares||{}).length?'later':'custom'):'equal';selected=i?Object.keys(i.shares||{}):(b?.participants||state.people.map(p=>p.id));custom={...(i?.shares||{})};draftPayer=i?.payer||'me';const options=state.bills.map(x=>`<option value="${x.id}" ${x.id===b?.id?'selected':''}>${esc(x.name)}</option>`).join('');modal(`${header(i?'แก้ไขรายการ':'เพิ่มค่าใช้จ่าย')}<form id="expenseForm" class="stack" onsubmit="saveExpense(event)"><div class="field"><label>บิลที่ต้องการบันทึก</label><select id="expenseBill" onchange="changeExpenseBill()"><option value="">— เลือกบิล —</option>${options}</select></div>${!state.bills.length?`<div class="alert">สร้างบิลก่อนบันทึกรายการ <button type="button" class="smallbtn" onclick="openBill()">สร้างบิล</button></div>`:''}<div class="field"><label>ยอดเงิน (บาท)</label><input id="expenseAmount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required placeholder="0.00" value="${i?.amount??''}" oninput="renderShares()" style="font-size:27px;font-weight:800"></div><div class="field"><label>ชื่อรายการ</label><input name="name" maxlength="120" required placeholder="เช่น ชาบู + เครื่องดื่ม" value="${esc(i?.name||'')}"></div><div class="chips">${['🍽️ อาหาร','☕ กาแฟ','🚕 เดินทาง','🎬 ดูหนัง','🛍️ ช้อปปิ้ง'].map(s=>`<button type="button" class="chip" onclick="document.querySelector('[name=name]').value='${s}'">${s}</button>`).join('')}</div><div class="field"><label>ใครจ่ายก่อน</label><select id="payer" onchange="draftPayer=this.value">${state.people.map(p=>`<option value="${p.id}" ${draftPayer===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>วันที่</label><input type="date" name="date" required value="${i?.date||today()}"></div><div class="field"><label>โน้ต / ร้าน / สถานที่ (ไม่บังคับ)</label><textarea name="note" rows function changeExpenseBill(){selected=bill($('#expenseBill').value)?.participants||[];custom={};renderShares()}function setSplit(v){splitMode=v;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.textContent===({equal:'หารเท่ากัน',custom:'กำหนดยอด',percent:'เปอร์เซ็นต์',later:'ค่อยหาร'}[v])));renderShares()}function renderShares(){const el=$('#shares');if(!el)return;const b=bill($('#expenseBill')?.value);if(splitMode==='later'){el.innerHTML='<div class="alert">บันทึกไว้ก่อนโดยยังไม่หารยอด แล้วค่อยกลับมาแก้ไขได้</div>';return}if(!b){el.innerHTML='<div class="subtle">เลือกบิลก่อน</div>';return}const members=[...new Set([...b.participants,...selected])].filter(id=>state.people.some(p=>p.id===id));el.innerHTML=`<div class="field"><label>ใครร่วมรายการนี้บ้าง?</label>${members.map(id=>`<div class="person"><label class="row"><input type="checkbox" ${selected.includes(id)?'checked':''} onchange="toggleMember('${id}',this.checked)"><span>${esc(person(id))}</span></label>${selected.includes(id)&&splitMode!=='equal'?`<div style="width:112px"><input type="number" min="0" step="0.01" inputmode="decimal" placeholder="${splitMode==='percent'?'%':'บาท'}" value="${custom[id]??''}" oninput="custom['${id}']=this.value;updateShareSummary()"></div>`:''}</div>`).join('')}</div><div class="subtle" id="shareSummary"></div>`;updateShareSummary()}function toggleMember(id,v){selected=v?[...new Set([...selected,id])]:selected.filter(x=>x!==id);renderShares()}function updateShareSummary(){const el=$('#shareSummary');if(!el)return;const amount=cents($('#expenseAmount')?.value)/100;if(splitMode==='equal'){el.textContent=selected.length?`หาร ${selected.length} คน · คนละประมาณ ${money(amount/selected.length)}`:'กรุณาเลือกคนหาร';return}const sum=selected.reduce((s,id)=>s+(Number(custom[id])||0),0);el.textContent=splitMode==='percent'?`รวม ${sum.toFixed(2)}% (ต้องครบ 100%)`:`รวม ${money(sum)} จาก ${money(amount)}`;el.style.color=Math.abs(sum-(splitMode==='percent'?100:amount))>.009?'#bd5b4e':'#27775d'}function calcShares(amount){if(splitMode==='later')return {};if(!selected.length)throw Error('กรุณาเลือกคนหาร');const sum=cents(amount);if(splitMode==='equal'){let each=Math.floor(sum/selected.length),rem=sum-each*selected.length;return Object.fromEntries(selected.map((id,n)=>[id,(each+(n<rem?1:0))/100]))}if(splitMode==='custom'){const vals=selected.map(id=>cents(custom[id]));if(vals.some(v=>v<0)||vals.reduce((a,b)=>a+b,0)!==sum)throw Error('ยอดที่แบ่งแต่ละคนต้องรวมเท่ากับยอดทั้งหมด');return Object.fromEntries(selected.map((id,n)=>[id,vals[n]/100]))}const vals=selected.map(id=>Number(custom[id]));if(vals.some(v=>!Number.isFinite(v)||v<0)||Math.abs(vals.reduce((a,b)=>a+b,0)-100)>.001)throw Error('เปอร์เซ็นต์ต้องรวมกันเท่ากับ 100');const raw=vals.map(v=>sum*v/100),parts=raw.map(Math.floor);let remain=sum-parts.reduce((a,b)=>a+b,0);const order=raw.map((v,n)=>({n,frac:v-parts[n]})).sort((a,b)=>b.frac-a.frac);for(let k=0;k<remain;k++)parts[order[k].n]++;return Object.fromEntries(selected.map((id,n)=>[id,parts[n]/100]))}function saveExpense(e){e.preventDefault();const f=new FormData(e.target),b=bill($('#expenseBill').value),amount=Number(f.get('amount'));if(!b)return alert('กรุณาเลือกบิล');if(!(amount>0)||!Number.isFinite(amount))return alert('กรุณาใส่ยอดเงิน');let shares;try{shares=calcShares(amount)}catch(err){return alert(err.message)}const record={id:editing||uid(),name:String(f.get('name')).trim(),amount:Math.round(amount*100)/100,payer:$('#payer').value,date:f.get('date'),note:f.get('note'),receipt:receiptData,shares};if(!record.name)return alert('ใส่ชื่อรายการ');if(editing){const old=b.items.findIndex(i=>i.id===editing);if(old<0)return alert('ไม่พบรายการเดิม');b.items[old]=record}else b.items.push(record);if(!persist())return;closeModal();go('detail',b.id)}function loadReceipt(input){const file=input.files?.[0];if(!file)return;if(file.size>15*1024*1024)return alert('รูปใหญ่เกินไป (สูงสุด 15 MB)');const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,1100/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);receiptData=c.toDataURL('image/jpeg',.7);$('#receiptPreview').innerHTML=`<img class="receipt" src="${receiptData}"><button type="button" class="smallbtn" onclick="receiptData=null;$('#receiptPreview').innerHTML=''">ลบรูป</button>`};img.src=reader.result};reader.readAsDataURL(file)}function deleteExpense(id){if(!confirm('ลบรายการนี้?'))return;const b=bill($('#expenseBill').value);b.items=b.items.filter(i=>i.id!==id);persist();closeModal();go('detail',b.id)}function openSettle(from,to,amount){modal(`${header('บันทึกการคืนเงิน')}<form class="stack" onsubmit="saveSettle(event,'${from}','${to}')"><p>${esc(person(from))} โอนให้ ${esc(person(to))}</p><div class="field"><label>จำนวนเงิน (บาท)</label><input name="amount" type="number" min="0.01" step="0.01" value="${amount.toFixed(2)}" required></div><div class="field"><label>วันที่โอน</label><input name="date" type="date" value="${today()}" required></div><button class="btn full">บันทึกยอดคืนเงิน</button></form>`)}function saveSettle(e,from,to){e.preventDefault();const f=new FormData(e.target),amount=Number(f.get('amount')),b=current();if(!Number.isFinite(amount)||amount<=0)return alert('ยอดไม่ถูกต้อง');const outstanding=transfers(b).find(t=>t.from===from&&t.to===to)?.amount||0;if(cents(amount)>cents(outstanding))return alert('ยอดคืนมากกว่ายอดค้าง');b.settlements.push({id:uid(),from,to,amount:Math.round(amount*100)/100,date:f.get('date')});persist();closeModal();render()}function deleteSettlement(id){if(!confirm('ยกเลิกประวัติคืนเงินรายการนี้?'))return;const b=current();b.settlements=b.settlements.filter(s=>s.id!==id);persist();render()}function deleteBill(){if(!confirm('ลบบิลและรายการทั้งหมดในบิลนี้อย่างถาวร?'))return;state.bills=state.bills.filter(b=>b.id!==current().id);billId=null;state.activeBill=state.bills[0]?.id||null;persist();go('bills')}function summaryText(b){return `#ourbills · ${b.name}\n${datefmt(b.date)}\nยอดรวม ${money(total(b))}\n\n${b.items.map(i=>`${i.name}: ${money(i.amount)} (${person(i.payer)} จ่าย)`).join('\n')}\n\nยอดที่ต้องโอน\n${transfers(b).map(t=>`${person(t.from)} → ${person(t.to)} ${money(t.amount)}`).join('\n')||'เคลียร์แล้ว'}${b.items.some(i=>!Object.keys(i.shares||{}).length)?'\n* ยังมีรายการที่รอหาร':''}`}async function shareBill(){const b=current(),txt=summaryText(b);try{if(navigator.share)await navigator.share({title:b.name,text:txt});else if(navigator.clipboard){await navigator.clipboard.writeText(txt);alert('คัดลอกสรุปแล้ว ส่งใน LINE ได้เลย')}else prompt('คัดลอกสรุป',txt)}catch(e){if(e.name!=='AbortError')prompt('คัดลอกสรุป',txt)}}function download(name,content,type='application/json'){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}function exportOneBill(){const b=current();download('ourbills-'+b.date+'.json',JSON.stringify({bill:b,people:state.people},null,2))}function openSettings(){modal(`${header('ตั้งค่าและข้อมูล')}<div class="stack"><button class="btn secondary full" onclick="state.theme=state.theme==='dark'?'light':'dark';persist();closeModal();render()">สลับ Light / Dark Mode</button><button class="btn secondary full" onclick="download('ourbills-backup.json',JSON.stringify(state,null,2))">สำรองข้อมูลทั้งหมด (JSON)</button><div class="field"><label>นำเข้าข้อมูลสำรอง v2 (แทนข้อมูลปัจจุบัน)</label><input type="file" accept=".json,application/json" onchange="importBackup(this)"></div><div class="alert">ข้อมูลเก็บในเบราว์เซอร์ของอุปกรณ์นี้เท่านั้น กรุณาสำรองข้อมูลเป็นระยะ โดยเฉพาะเมื่อแนบสลิปจำนวนมาก</div><div class="subtle">#ourbills 3.0 · No account, just split.</div></div>`)}function importBackup(input){const f=input.files?.[0];if(!f)return;const r= const baseRender=render;
render=function(){if(page==='inbox'){document.body.classList.toggle('dark',state.theme==='dark');for(const n of ['home','bills','people','inbox']){const el=$('#nav-'+n);if(el)el.classList.toggle('active',n==='inbox')}$('#view').innerHTML=inboxView();loadInboxThumbs();return}baseRender();const nav=$('#nav-inbox');if(nav)nav.classList.remove('active');if(page==='home'){const count=state.inbox.filter(x=>x.status==='pending').length;$('#view').insertAdjacentHTML('afterbegin',`<div class="inbox-banner"><b>▧ Bill Inbox · ${count} รายการรอเคลียร์</b><div class="subtle" style="margin:5px 0 10px">เก็บสลิป ชื่อร้าน และสถานที่ไว้ก่อน แล้วค่อยหารทีหลัง</div><button class="smallbtn" onclick="go('inbox')">เปิด Inbox →</button> <button class="smallbtn" onclick="openInboxCapture()">+ เก็บสลิป</button></div>`)}};
function inboxView(){const pending=state.inbox.filter(x=>x.status==='pending');let items=state.inbox.filter(x=>(inboxFilter==='all'||x.status===inboxFilter)&&[x.shop,x.place,x.note,x.date,x.amount].join(' ').toLowerCase().includes(inboxQuery.toLowerCase())).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));return `<div class="eyebrow">SAVE NOW · SPLIT LATER</div><h1 class="heading">เก็บก่อน เคลียร์ทีหลัง.</h1><div class="row between"><span class="subtle"><span class="inbox-count">${pending.length}</span> รายการรอเคลียร์</span><span class="subtle">ไม่ต้องสมัครสมาชิก</span></div><div class="inbox-toolbar"><button class="btn" onclick="openInboxCapture()">＋ เพิ่มหลายสลิป</button><button class="btn secondary" onclick="openInboxCapture(true)">＋ โน้ตเปล่า</button></div><div class="field" style="margin-bottom:12px"><input id="inboxSearch" placeholder="ค้นหาชื่อร้าน สถานที่ โน้ต หรือยอดเงิน" value="${esc(inboxQuery)}" oninput="inboxQuery=this.value;updateInboxList()"></div><div class="chips" style="margin-bottom:15px">${[['pending','รอเคลียร์'],['cleared','เคลียร์แล้ว'],['all','ทั้งหมด']].map(([k,t])=>`<button class="chip ${inboxFilter===k?'selected':''}" onclick="inboxFilter='${k}';render()">${t}</button>`).join('')}</div><div id="inboxList">${inboxCards(items)}</div>`}
function inboxCards(items){return items.length?items.map(x=>`<div class="card"><div class="inbox-card"><div class="inbox-thumb blank" id="thumb-${x.id}">▧</div><div class="inbox-meta"><b>${esc(x.shop||'ยังไม่ระบุชื่อร้าน')}</b><div class="subtle">${esc(x.place||'ไม่ระบุสถานที่')} · ${esc(x.date||'')}</div><div class="row between" style="margin-top:5px"><strong>${Number(x.amount)>0?money(x.amount):'ยังไม่ใส่ยอด'}</strong><span class="pill">${x.status==='cleared'?'เคลียร์แล้ว':'รอเคลียร์'}</span></div>${x.note?`<div class="subtle">${esc(x.note)}</div>`:''}<div class="inbox-actions"><button class="smallbtn" onclick="editInbox('${x.id}')">ดู / แก้ไข</button>${x.status==='pending'?`<button class="smallbtn" onclick="convertInbox('${x.id}')">นำไปหาร →</button>`:`<button class="smallbtn" onclick="reopenInbox('${x.id}')">กลับไปรอเคลียร์</button>`}</div></div></div></div>`).join(''):'<div class="empty">ยังไม่มีรายการในหมวดนี้<br>เพิ่มสลิปหรือโน้ตได้เลย</div>'}
function updateInboxList(){const list=state.inbox.filter(x=>(inboxFilter==='all'||x.status===inboxFilter)&&[x.shop,x.place,x.note,x.date,x.amount].join(' ').toLowerCase().includes(inboxQuery.toLowerCase())).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));$('#inboxList').innerHTML=inboxCards(list);loadInboxThumbs()}
async function loadInboxThumbs(){for(const x of state.inbox){const el=document.getElementById('thumb-'+x.id);if(!el||!x.hasPhoto)continue;try{const src=await photoGet(x.id);if(src&&el.isConnected){const img=document.createElement('img');img.className='inbox-thumb';img.src=src;img.alt='สลิป';el.replaceWith(img)}}catch(e){console.warn(e)}}}
function openInboxCapture(noPhoto=false){modal(`${header('เก็บสลิปไว้ก่อน')}<form class="stack" onsubmit="saveInboxCapture(event)"><div class="field"><label>เลือกรูปสลิปหลายรูป (ไม่บังคับ)</label><input id="captureFiles" type="file" accept="image/*" multiple ${noPhoto?'':' '}><div class="subtle">เลือกหลายรูป = สร้างหลายรายการ โดยใช้ชื่อร้านและสถานที่เดียวกันก่อน สามารถแก้แยกทีหลังได้</div></div><div class="field"><label>ชื่อร้าน / รายการ</label><input name="shop" placeholder="เช่น ชาบู / ค่าน้ำมัน" required></div><div class="field"><label>สถานที่</label><input name="place" placeholder="เช่น เซ็นทรัลเชียงใหม่"></div><div class="form-two"><div class="field"><label>วันที่จ่าย</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>ยอดต่อสลิป (ถ้าทราบ)</label><input name="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></div></div><div class="field"><label>โน้ตช่วยจำ</label><textarea name="note" rows="2" placeholder="ไปกับใคร / ทริปไหน / จ่ายค่าอะไร"></textarea></div><button class="btn full">บันทึกไว้ใน Inbox</button></form>`)}
async function compressPhoto(file){if(!file.type.startsWith('image/'))throw Error('รองรับเฉพาะรูปภาพ');if(file.size>20*1024*1024)throw Error('รูปใหญ่เกิน 20 MB');const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file)});const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=data});const scale=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.76)}
async function saveInboxCapture(e){e.preventDefault();const form=e.target,fd=new FormData(form),files=[...$('#captureFiles').files];const base={shop:String(fd.get('shop')).trim(),place:String(fd.get('place')).trim(),date:String(fd.get('date')),amount:Math.round((Number(fd.get('amount'))||0)*100)/100,note:String(fd.get('note')).trim()};if(!base.shop)return alert('กรุณาใส่ชื่อร้าน');if(base.amount<0)return alert('ยอดเงินต้องไม่ติดลบ');const button=form.querySelector('button[type=submit],button.btn');button.disabled=true;button.textContent='กำลังบันทึก...';let done=0;try{for(const file of files.length?files:[null]){const id=uid(),photo=file?await compressPhoto(file):null;if(photo)await photoPut(id,photo);state.inbox.push({...base,id,hasPhoto:!!photo,status:'pending',createdAt:new Date().toISOString()});done++}if(!persist())throw Error('บันทึกรายการไม่สำเร็จ');closeModal();go('inbox')}catch(err){alert(`บันทึกได้ ${done} รายการ แล้วพบปัญหา: ${err.message}`);persist();closeModal();go('inbox')}}
async function editInbox(id){const x=state.inbox.find(i=>i.id===id);if(!x)return;let photo=null;try{photo=await photoGet(id)}catch{}modal(`${header('รายละเอียดสลิป')}${photo?`<img class="preview-large" src="${photo}" alt="รูปสลิป">`:''}<form class="stack" onsubmit="saveInboxEdit(event,'${id}')"><div class="field"><label>ชื่อร้าน</label><input name="shop" value="${esc(x.shop)}" required></div><div class="field"><label>สถานที่</label><input name="place" value="${esc(x.place)}"></div><div class="form-two"><div class="field"><label>วันที่จ่าย</label><input name="date" type="date" value="${esc(x.date)}" required></div><div class="field"><label>ยอดเงิน</label><input name="amount" type="number" min="0" step="0.01" value="${x.amount||''}"></div></div><div class="field"><label>โน้ต</label><textarea name="note" rows="2">${esc(x.note)}</textarea></div><button class="btn full">บันทึกการแก้ไข</button><button type="button" class="btn secondary full" onclick="closeModal();convertInbox('${id}')">นำรายการไปหาร →</button><button type="button" class="btn danger full" onclick="deleteInbox('${id}')">ลบรายการและรูป</button></form>`)}
function saveInboxEdit(e,id){e.preventDefault();const x=state.inbox.find(i=>i.id===id),f=new FormData(e.target);if(!x)return;x.shop=String(f.get('shop')).trim();x.place=String(f.get('place')).trim();x.date=String(f.get('date'));x.note=String(f.get('note')).trim();x.amount=Math.round((Number(f.get('amount'))||0)*100)/100;if(!x.shop||x.amount<0)return alert('ตรวจสอบชื่อร้านและยอดเงิน');persist();closeModal();render()}
async function deleteInbox(id){if(!confirm('ลบรายการและสลิปนี้ถาวร?'))return;state.inbox=state.inbox.filter(x=>x.id!==id);persist();try{await photoDelete(id)}catch{}closeModal();render()}
function reopenInbox(id){const x=state.inbox.find(i=>i.id===id);if(x){x.status='pending';persist();render()}}
function convertInbox(id){const x=state.inbox.find(i=>i.id===id);if(!x)return;if(!state.bills.length){modal(`${header('ต้องสร้างบิลก่อน')}<div class="alert">สร้างบิลหรือทริปก่อน แล้วกลับมาเลือก “นำไปหาร” จาก Inbox</div><button class="btn full" onclick="openBill()">สร้างบิล</button>`);return}const choices=state.bills.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('');modal(`${header('นำสลิปไปหาร')}<form class="stack" onsubmit="startInboxSplit(event,'${id}')"><p class="subtle">${esc(x.shop)} · ${x.amount?money(x.amount):'ยังไม่ใส่ยอด'}</p><div class="field"><label>เลือกบิล / ทริป</label><select name="bill">${choices}</select></div><button class="btn full">ไปหน้าแบ่งยอด</button></form>`)}
async function startInboxSplit(e,id){e.preventDefault();const x=state.inbox.find(i=>i.id===id),b=bill(new FormData(e.target).get('bill'));if(!x||!b)return;openExpense(null,b.id);const form=$('#expenseForm');if(!form)return;const name=form.querySelector('[name=name]'),amount=form.querySelector('[name=amount]'),date=form.querySelector('[name=date]'),note=form.querySelector('[name=note]');if(name)name.value=x.shop;if(amount)amount.value=x.amount||'';if(date)date.value=x.date;if(note)note.value=[x.place&&'สถานที่: '+x.place,x.note,'Inbox: '+x.id].filter(Boolean).join(' · ');const oldOnSubmit=form.getAttribute('onsubmit');form.onsubmit=function(ev){const before=b.items.length;saveExpense(ev);if(b.items.length>before){x.status='cleared';x.linkedBill=b.id;x.linkedItem=b.items[b.items.length-1].id;persist()}};try{const img=await photoGet(id);if(img){receiptData=img;const preview=$('#receiptPreview');if(preview)preview.innerHTML='<div class="subtle">แนบสลิปจาก Inbox แล้ว (เก็บต้นฉบับไว้ใน Inbox ด้วย)</div><img class="receipt" src="'+img+'">'}}catch{}}
async function exportFullBackup(){const photos={};for(const x of state.inbox){if(x.hasPhoto){try{const data=await photoGet(x.id);if(data)photos[x.id]=data}catch{}}}download('ourbills-3-backup-'+today()+'.json',JSON.stringify({format:'ourbills-v3',state,photos}), 'application/json')}
async function importFullBackup(input){const f=input.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text()),d=data.format==='ourbills-v3'?data.state:data;if(!Array.isArray(d.people)||!Array.isArray(d.bills)||!d.people.some(p=>p.id==='me'))throw Error('รูปแบบข้อมูลไม่ถูกต้อง');if(!confirm('แทนที่ข้อมูลปัจจุบันทั้งหมด? แนะนำให้สำรองข้อมูลเดิมก่อน'))return;const photos=data.photos||{};for(const [id,photo] of Object.entries(photos))await photoPut(id,photo);state={...d,inbox:Array.isArray(d.inbox)?d.inbox:[]};persist();closeModal();go('home');alert('นำเข้าสำเร็จ')}catch(err){alert('นำเข้าไม่สำเร็จ: '+err.message)}}
openSettings=function(){modal(`${header('ตั้งค่าและข้อมูล')}<div class="stack"><div class="alert">ไม่ต้องสมัครสมาชิก ข้อมูลและรูปสลิปเก็บในอุปกรณ์นี้เท่านั้น ถ้าลบข้อมูลเว็บไซต์หรือเปลี่ยนเครื่อง ข้อมูลอาจหายได้</div><button class="btn secondary full" onclick="state.theme=state.theme==='dark'?'light':'dark';persist();closeModal();render()">สลับ Light / Dark Mode</button><button class="btn secondary full" onclick="exportFullBackup()">สำรองข้อมูลและรูปสลิปทั้งหมด (JSON)</button><div class="field"><label>นำเข้าข้อมูลสำรอง v2 / v3 (แทนข้อมูลปัจจุบัน)</label><input type="file" accept=".json,application/json" onchange="importFullBackup(this)"></div><button class="btn danger full" onclick="clearOurbills()">ลบข้อมูลทั้งหมดในเครื่องนี้</button><div class="subtle">#ourbills 3.0 · No account, just split.</div></div>`)};
async function clearOurbills(){if(!confirm('ลบบิล รายการ สลิป และประวัติทั้งหมดในเครื่องนี้? ไม่สามารถกู้คืนได้หากไม่มี Backup'))return;try{const db=await inboxDB();db.close();await new Promise((res,rej)=>{const req=indexedDB.deleteDatabase(INBOX_DB);req.onsuccess=res;req.onerror=()=>rej(req.error);req.onblocked=()=>rej(Error('ปิดแท็บอื่นของแอปก่อน'))});localStorage.removeItem(KEY);location.reload()}catch(e){alert('ลบไม่สำเร็จ: '+e.message)}}
render();
</script></body></html>
